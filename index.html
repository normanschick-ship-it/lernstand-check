<style>
/* Layout: one question per screen like a slide deck; fixed bottom bar with progress bar and back/next. */
:root{
  --bg:#f1f4f1; --card:#ffffff; --ink:#1b211d; --muted:#5a645d; --line:#d3dcd5;
  --accent:#1f7a4d; --accent-soft:#dcefe3; --accent-ink:#145236;
  --good:#1f7a4d; --mid:#a86a00; --bad:#b42323;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141916; --card:#1d241f; --ink:#e8eee9; --muted:#9faba2; --line:#33403a;
  --accent:#4fc888; --accent-soft:#16352a; --accent-ink:#9fe6bf;
  --good:#6fd39c; --mid:#f0c060; --bad:#ff8a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --card:#1d241f; --ink:#e8eee9; --muted:#9faba2; --line:#33403a;
  --accent:#4fc888; --accent-soft:#16352a; --accent-ink:#9fe6bf;
  --good:#6fd39c; --mid:#f0c060; --bad:#ff8a8a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.stage{min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 150px}
.slide{max-width:620px;width:100%;margin:auto;display:flex;flex-direction:column;gap:18px}
@media (prefers-reduced-motion:no-preference){.slide{animation:in .28s ease-out}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.4rem,9vw,3.4rem);line-height:.95}
h2{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.05}
h3{font-size:1.2rem}
p{margin:0}
.eyebrow{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tag{align-self:flex-start;font-family:var(--display);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:3px 10px;border-radius:4px}
.lead{color:var(--muted)}
.hint{font-size:.88rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.spur-h{font-family:var(--display);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--display);color:var(--muted);font-size:.82rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.chip[aria-pressed="true"] small{color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lz{border-left:4px solid var(--accent);padding:2px 0 2px 14px;border-radius:0}
.lz b{font-family:var(--display);font-size:1rem;letter-spacing:.05em}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.8rem;padding:3px 9px;border-radius:4px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.ol{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ol li{display:flex;gap:12px;align-items:center}
.k{flex:0 0 auto;font-family:var(--display);font-weight:700;font-size:1rem;line-height:1;padding:7px 8px;border-radius:6px;background:var(--ink);color:var(--card);text-align:center;min-width:52px}
.k small{display:block;font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.k.extra{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.kbig{display:flex;gap:14px;align-items:center}
.kbig .k{font-size:1.4rem;min-width:70px;padding:10px}
.kbig h2{font-size:clamp(1.35rem,5.2vw,2rem)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(5rem,26vw,8rem);line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
.big.unset{color:var(--line)}
.word{text-align:center;font-weight:600;min-height:1.5em}
input[type=range]{width:100%;accent-color:var(--accent);height:36px;margin:0}
.untouched input[type=range]{opacity:.5}
.ticks{display:flex;justify-content:space-between;font-family:var(--display);font-size:.9rem;color:var(--muted);padding:0 6px}
.c-good{color:var(--good)} .c-mid{color:var(--mid)} .c-bad{color:var(--bad)}
svg text{font-family:var(--display);fill:var(--ink)}
.grid-l{fill:none;stroke:var(--line)}
.grid-4{fill:none;stroke:var(--muted);stroke-dasharray:4 4}
.area{fill:var(--accent);fill-opacity:.25;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.pt{fill:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.ff{border-left:4px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:8px}
.ff .src{font-size:.86rem;color:var(--muted)}
.seg{display:flex;flex-direction:column;gap:10px}
.seg button{font:inherit;font-size:1.1rem;font-weight:600;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:140px;resize:vertical}
.ticket{border:2px dashed var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.ticket .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--line);padding-bottom:4px}
.ticket .row span:first-child{color:var(--muted)}
.ticket .row span:last-child{text-align:right}
.btn{font:inherit;font-weight:600;padding:12px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
#copied{font-size:.9rem;color:var(--good)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-top b{color:var(--ink);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:.9rem}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.nav .btn.primary{flex:1;max-width:260px;margin-left:auto}
#err{font-size:.86rem;color:var(--bad);min-height:1.2em;text-align:right}
.tw{overflow-x:auto}
table.info{width:100%;border-collapse:collapse;min-width:380px;font-size:.9rem}
table.info td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
table.info td:first-child{font-weight:600;white-space:nowrap}
details summary{cursor:pointer;font-weight:600;font-size:.92rem}
.rs{display:flex;flex-direction:column;gap:2px;padding:10px 0 4px;border-top:1px solid var(--line)}
.rs:first-of-type{border-top:0}
.rh{display:flex;gap:10px;align-items:center}
.rh .k{min-width:44px;padding:5px 6px;font-size:.85rem}
.rl{flex:1;font-size:.95rem;line-height:1.3}
.rv{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.rv.unset{color:var(--line)}
.scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:var(--display);letter-spacing:.04em}
.tl{font-weight:600;margin-top:4px}
.tx textarea{min-height:80px}
</style>

<main class="stage"><div id="slide" class="slide" aria-live="polite"></div></main>
<nav class="bar" aria-label="Fortschritt">
  <div class="bar-in">
    <div class="prog-top"><b id="sec">Start</b><span id="count">1 / 1</span></div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="track"><div class="fill" id="fill" style="width:0"></div></div>
    <div id="err" aria-live="assertive"></div>
    <div class="nav">
      <button class="btn" type="button" id="back">Zurück</button>
      <button class="btn primary" type="button" id="next">Weiter</button>
    </div>
  </div>
</nav>

function spider(t){const s0=sc[t.id],n=t.g.length,cx=240,cy=160,R=95;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*(v-1)/5;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  let s=`<svg viewBox="0 0 480 320" width="100%" role="img" aria-label="Netzdiagramm ${t.name}">`;
  for(let l=2;l<=6;l++)s+=`<polygon class="${l===4?'grid-4':'grid-l'}" points="${t.g.map((_,i)=>pt(i,l).join(',')).join(' ')}"/>`;
  t.g.forEach((g,i)=>{const[x,y]=pt(i,6),[lx,ly]=pt(i,7.25),anc=Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end';
    s+=`<line class="grid-l" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/><text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="12.5" font-weight="700">${g[1]}</text><text x="${lx}" y="${ly+13}" text-anchor="${anc}" font-size="11" style="fill:var(--muted)">K${g[0]} · ${fmt(s0[i])}</text>`});
  s+=`<polygon class="area" points="${s0.map((v,i)=>pt(i,v).join(',')).join(' ')}"/>`;
  s0.forEach((v,i)=>{const[x,y]=pt(i,v);s+=`<circle class="pt" r="5" cx="${x}" cy="${y}"/>`});return s+'</svg>'}
function focus(t){const s0=sc[t.id];const gap=s0.findIndex(v=>v<4);

function fb(t){const a=document.createElement('textarea');a.value=t;$('copied').textContent='Text unten markieren und kopieren:';$('copied').after(a);a.select()}
function updateBar(){const S=slides(),pct=Math.round(step/(S.length-1)*100);$('fill').style.width=pct+'%';$('track').setAttribute('aria-valuenow',pct);
  $('sec').textContent=S[step].sec;$('count').textContent=`${step+1} / ${topics().length?S.length:12}`;

function go(n){const S=slides();step=Math.max(0,Math.min(n,S.length-1));const s=S[step];
  $('slide').innerHTML=s.html();s.bind&&s.bind();$('err').textContent='';updateBar();window.scrollTo({top:0})}

  const e=s.ok?s.ok():'';if(e){$('err').textContent=e;return}go(step+1)};
$('back').onclick=()=>go(step-1);
go(0);
</script>
